<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1554c9">
<title>ComparaFácil Perú 1.3</title>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#1d293c;background:#f4f7fd}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:linear-gradient(120deg,#19499e,#1766e9);color:white;padding:26px 18px 16px}.wrap{max-width:920px;margin:auto}.logo{font-size:clamp(25px,6vw,36px);font-weight:750}.sub{color:#e1eaff;margin:8px 0 22px}nav{display:flex;gap:5px;justify-content:space-between;overflow-x:auto}nav button{color:white;border:0;background:transparent;border-radius:12px;padding:13px 9px;white-space:nowrap}nav button.active{background:#ffffff35}main{max-width:920px;margin:25px auto;padding:0 15px;min-height:50vh}.panel,.tile{background:white;border:1px solid #e0e5ed;border-radius:24px;padding:24px;margin-bottom:18px;box-shadow:0 12px 28px #102c6110}h1{font-size:clamp(27px,6vw,39px);line-height:1.2;margin:18px 0}h2{font-size:25px}h3{font-size:21px;margin:12px 0}.muted{color:#687588;line-height:1.65}.pill{display:inline-block;background:#e6f6ed;color:#176044;border-radius:999px;padding:9px 14px;font-weight:650}.btn{border:0;border-radius:14px;padding:16px 18px;background:#1b60e9;color:white;font-weight:650;width:100%;margin:7px 0}.btn.alt{background:#e9eff9;color:#29415e}.btn:disabled{opacity:.45}.choice{display:block;width:100%;text-align:left;background:#eef3fd;color:#24334b;border:2px solid transparent;border-radius:16px;padding:18px;margin:10px 0}.choice:focus-visible,.btn:focus-visible{outline:3px solid #79a9ff}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#2773ed;transition:width .2s}.grid{display:grid;gap:14px}.card{border:1px solid #e1e6ed;border-radius:20px;padding:18px;background:white}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.tag{background:#eef3fa;padding:6px 9px;border-radius:9px;font-size:14px}.note{background:#fff6e8;border-left:4px solid #dc951c;border-radius:12px;padding:14px;margin:14px 0;line-height:1.55}.info{background:#edf4ff;border-left:4px solid #2874e4;border-radius:12px;padding:14px;margin:14px 0;line-height:1.5}.field{width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:13px;margin:7px 0 14px;background:white;color:#20314c}label{display:block;margin-top:9px}input[type=checkbox]{width:19px;height:19px;vertical-align:middle;accent-color:#1b60e9}.count{font-weight:650;color:#1554c9}.compare-list{display:grid;gap:14px}.compare-model{background:#fff;border:1px solid #dce4ef;border-radius:20px;padding:18px}.spec{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid #edf0f5;font-size:15px}.spec strong{color:#4c5d76}.small{font-size:13px}.footer{text-align:center;color:#7c889a;padding:24px 15px 45px}a{color:#195dc9}.actions{display:grid;gap:6px}@media(min-width:680px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.actions{grid-template-columns:repeat(2,1fr)}.panel{padding:34px}.compare-list{grid-template-columns:repeat(3,minmax(0,1fr))}.spec{display:block}.spec strong{display:block;margin-bottom:6px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="logo">✦ ComparaFácil Perú</div><p class="sub">Compara mejor. Decide con confianza.</p><nav id="nav" aria-label="Navegación principal"></nav></div></header>
<main id="app" aria-live="polite"></main><footer class="footer">ComparaFácil Perú · Versión 1.3 · Demostración<br><a href="#" id="privacy">Privacidad y transparencia</a></footer>
<script>
'use strict';
const phones=[
{id:'a16',name:'Samsung Galaxy A16 5G',brand:'Samsung',profile:'equilibrio',size:6.7,desc:'Uso cotidiano, comunicación y pantalla amplia.',camera:'Por verificar',battery:'Por verificar',chip:'Por verificar',ram:'Por verificar',storage:'Por verificar',price:null},
{id:'s25',name:'Samsung Galaxy S25',brand:'Samsung',profile:'rendimiento',size:6.2,desc:'Gama alta y formato compacto.',camera:'Por verificar',battery:'Por verificar',chip:'Por verificar',ram:'Por verificar',storage:'Por verificar',price:null},
{id:'poco',name:'POCO X7 Pro',brand:'POCO',profile:'rendimiento',size:6.67,desc:'Orientado a juegos y rendimiento.',camera:'Por verificar',battery:'Por verificar',chip:'Por verificar',ram:'Por verificar',storage:'Por verificar',price:null},
{id:'redmi',name:'Redmi Note 14 Pro 5G',brand:'Xiaomi',profile:'fotografia',size:6.67,desc:'Fotografía y contenido multimedia.',camera:'Por verificar',battery:'Por verificar',chip:'Por verificar',ram:'Por verificar',storage:'Por verificar',price:null},
{id:'moto',name:'Motorola moto g85 5G',brand:'Motorola',profile:'equilibrio',size:6.67,desc:'Comunicación y multimedia.',camera:'Por verificar',battery:'Por verificar',chip:'Por verificar',ram:'Por verificar',storage:'Por verificar',price:null}
];
const questions=[
{q:'¿Cuál es tu presupuesto máximo?',opts:[['Hasta S/ 700','700'],['S/ 701 a S/ 1.200','1200'],['S/ 1.201 a S/ 2.000','2000'],['Más de S/ 2.000','alto']]},
{q:'¿Qué característica es más importante?',opts:[['Cámara y video','fotografia'],['Duración de batería','bateria'],['Rendimiento','rendimiento'],['Equilibrio general','equilibrio']]},
{q:'¿Para qué utilizarás el celular?',opts:[['Redes sociales','redes'],['Trabajo y estudios','trabajo'],['Videojuegos','juegos'],['Creación de contenido','contenido']]},
{q:'¿Qué tamaño prefieres?',opts:[['Compacto','compacto'],['Pantalla grande','grande'],['Sin preferencia','indiferente']]}
];
let page='inicio',step=0,answers=[],selected=new Set(),query='',profile='todos';const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(){document.getElementById('nav').innerHTML=['inicio','test','catalogo','comparar'].map((p,i)=>`<button data-page="${p}" class="${page===p?'active':''}" ${page===p?'aria-current="page"':''}>${['Inicio','Test','Catálogo','Comparar'][i]}</button>`).join('')}
function go(p){page=p;nav();render();window.scrollTo(0,0)}
function btn(t,p,alt=false){return `<button class="btn ${alt?'alt':''}" data-page="${p}">${t}</button>`}
function home(){return `<section class="panel"><span class="pill">✨ Nueva versión 1.3</span><h1>Compara celulares de forma más sencilla.</h1><p class="muted">Responde cuatro preguntas, revisa opciones orientativas y compara hasta tres modelos en tu Android.</p>${btn('Comenzar test →','test')}${btn('Explorar catálogo','catalogo',true)}</section><div class="grid"><div class="tile"><h3>🎯 Recomendaciones explicadas</h3><p class="muted">Conoce por qué un modelo coincide con tus preferencias.</p></div><div class="tile"><h3>📱 Comparación móvil</h3><p class="muted">Características en tarjetas fáciles de leer.</p></div><div class="tile"><h3>🔎 Búsqueda y filtros</h3><p class="muted">Busca por marca y filtra por perfil.</p></div><div class="tile"><h3>🔐 Información transparente</h3><p class="muted">Sin inventar precios, ofertas ni especificaciones.</p></div></div>`}
function test(){let q=questions[step];return `<section class="panel"><p class="muted">Pregunta ${step+1} de 4</p><div class="progress"><div style="width:${(step+1)*25}%"></div></div><h1>${q.q}</h1>${q.opts.map(([label,value])=>`<button class="choice" data-answer="${value}">${label}</button>`).join('')}<button class="btn alt" data-back="1">← Atrás</button></section>`}
function score(p){let s=0,a=answers;if(p.profile===a[1])s+=6;if(a[1]==='bateria')s+=1;if(a[1]==='equilibrio'&&p.profile==='equilibrio')s+=3;if(a[2]==='juegos'&&p.profile==='rendimiento')s+=3;if(a[2]==='contenido'&&p.profile==='fotografia')s+=3;if(a[2]==='redes'&&p.profile==='equilibrio')s+=2;if(a[3]==='compacto'&&p.size<=6.3)s+=3;if(a[3]==='grande'&&p.size>=6.6)s+=3;return s}
function reason(p){let r=[];if(p.profile===answers[1])r.push('su perfil coincide con tu prioridad');if(answers[2]==='juegos'&&p.profile==='rendimiento')r.push('está orientado al rendimiento');if(answers[2]==='contenido'&&p.profile==='fotografia')r.push('su perfil está orientado a fotografía y contenido');if(answers[3]==='compacto'&&p.size<=6.3)r.push('tiene una pantalla relativamente compacta');if(answers[3]==='grande'&&p.size>=6.6)r.push('tiene una pantalla grande');return r.length?'Se incluye porque '+r.join(' y ')+'.':'Se incluye como alternativa para investigar y contrastar.'}
function check(p){return `<label><input type="checkbox" data-select="${p.id}" ${selected.has(p.id)?'checked':''}> Añadir a comparación</label>`}
function phoneCard(p,rank=false){return `<article class="card">${rank?`<span class="pill">Opción ${rank}</span>`:''}<h3>${esc(p.name)}</h3><p class="muted">${esc(p.desc)}</p><div class="tags"><span class="tag">Marca: ${esc(p.brand)}</span><span class="tag">Pantalla: ${p.size}"</span></div><p><strong>Precio:</strong> No verificado</p>${rank?`<p class="muted"><strong>Por qué aparece:</strong> ${esc(reason(p))}</p>`:''}${check(p)}</article>`}
function results(){let ranked=[...phones].sort((a,b)=>score(b)-score(a)).slice(0,3);let budget=questions[0].opts.find(x=>x[1]===answers[0])?.[0]||'Sin indicar';return `<section class="panel"><span class="pill">✓ Test completado</span><h1>Resultados personalizados</h1><p class="muted"><strong>Tu presupuesto:</strong> ${budget}</p><div class="note"><strong>Sin precios verificados.</strong> Estas opciones se ordenan por afinidad orientativa con tus respuestas, no por precio ni por pruebas técnicas. No podemos asegurar que estén dentro de tu presupuesto.</div><div class="grid">${ranked.map((p,i)=>phoneCard(p,i+1)).join('')}</div><p class="count" id="selection-count">${selected.size} de 3 seleccionados</p>${btn('Comparar seleccionados','comparar')}${btn('Repetir test','reset',true)}${btn('Catálogo completo','catalogo',true)}</section>`}
function catalog(){let items=phones.filter(p=>(p.name+' '+p.brand).toLocaleLowerCase('es').includes(query.toLocaleLowerCase('es'))&&(profile==='todos'||p.profile===profile));return `<section class="panel"><h1>Catálogo de celulares</h1><p class="muted">Modelos reales con perfiles orientativos. Las especificaciones y los precios deben verificarse antes de comprar.</p><label for="search">Buscar por marca o modelo</label><input class="field" id="search" type="search" value="${esc(query)}" placeholder="Samsung, POCO, Redmi..."><label for="filter">Filtrar por perfil</label><select class="field" id="filter">${[['todos','Todos'],['rendimiento','Rendimiento'],['fotografia','Fotografía'],['equilibrio','Equilibrio']].map(([v,l])=>`<option value="${v}" ${profile===v?'selected':''}>${l}</option>`).join('')}</select><div id="catalog-results" class="grid">${items.map(p=>phoneCard(p)).join('')||'<p>No se encontraron modelos. Prueba otra búsqueda.</p>'}</div><p class="count" id="selection-count">${selected.size} de 3 seleccionados</p>${btn('Comparar seleccionados','comparar')}<div class="info">Esta demostración no incluye enlaces comerciales ni anuncios activos.</div></section>`}
function compare(){let list=phones.filter(p=>selected.has(p.id));return `<section class="panel"><h1>Comparador de celulares</h1><p class="muted">Selecciona hasta tres modelos desde el catálogo o los resultados del test.</p>${!list.length?'<div class="info">Todavía no has seleccionado ningún modelo.</div>':`<p class="count">${list.length} de 3 modelos seleccionados</p><div class="compare-list">${list.map(p=>`<article class="compare-model"><h3>${esc(p.name)}</h3>${[['Marca',p.brand],['Pantalla',p.size+' pulgadas'],['Perfil',p.desc],['Cámara',p.camera],['Batería',p.battery],['Procesador',p.chip],['RAM',p.ram],['Almacenamiento',p.storage],['Precio','No verificado']].map(([k,v])=>`<div class="spec"><strong>${k}</strong><span>${esc(v)}</span></div>`).join('')}<button class="btn alt" data-remove="${p.id}">Quitar modelo</button></article>`).join('')}</div><div class="note">Los datos marcados «Por verificar» no son especificaciones técnicas confirmadas. Consulta fichas oficiales antes de tomar una decisión de compra.</div>`}<div class="actions">${btn('Elegir modelos','catalogo') }<button class="btn alt" data-clear="1">Limpiar selección</button></div></section>`}
function privacy(){return `<section class="panel"><h1>Privacidad y transparencia</h1><p>Esta versión es una demostración de una herramienta de orientación. No muestra precios, disponibilidad ni ofertas verificadas.</p><p>Las respuestas del cuestionario y la selección de modelos se procesan en esta página durante la sesión. Este prototipo no envía esos datos a un servidor propio.</p><p>No se integraron anuncios ni enlaces de afiliados en esta versión. Si se incorporan más adelante, deberán identificarse con claridad.</p>${btn('Volver al inicio','inicio')}</section>`}
function render(){nav();app.innerHTML=page==='inicio'?home():page==='test'?test():page==='resultados'?results():page==='catalogo'?catalog():page==='comparar'?compare():privacy()}
function select(id,checked){if(checked&&selected.size>=3&&!selected.has(id)){alert('Puedes comparar un máximo de tres modelos.');render();return}checked?selected.add(id):selected.delete(id);const count=document.getElementById('selection-count');if(count)count.textContent=`${selected.size} de 3 seleccionados`}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.answer){answers[step]=t.dataset.answer;if(step<3){step++;render();window.scrollTo(0,0)}else go('resultados')}else if(t.dataset.back){if(step>0){step--;render()}else go('inicio')}else if(t.dataset.remove){selected.delete(t.dataset.remove);render()}else if(t.dataset.clear){selected.clear();render()}else if(t.dataset.page){if(t.dataset.page==='reset'){step=0;answers=[];go('test')}else if(t.dataset.page==='test'){step=0;answers=[];go('test')}else go(t.dataset.page)}});
document.addEventListener('change',e=>{if(e.target.dataset.select)select(e.target.dataset.select,e.target.checked);if(e.target.id==='filter'){profile=e.target.value;render();document.getElementById('filter').focus()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const items=phones.filter(p=>(p.name+' '+p.brand).toLocaleLowerCase('es').includes(query.toLocaleLowerCase('es'))&&(profile==='todos'||p.profile===profile));document.getElementById('catalog-results').innerHTML=items.map(p=>phoneCard(p)).join('')||'<p>No se encontraron modelos. Prueba otra búsqueda.</p>'}});
document.getElementById('privacy').addEventListener('click',e=>{e.preventDefault();go('privacidad')});render();
</script></body></html>
